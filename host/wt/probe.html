  <h1>MoonBit js backend inside a Web Worker</h1>
  <p>See <code>host/verify_wt_g1.mjs</code>. The Worker is created by the driver,
     not by this page, so the page only needs to exist as a same-origin secure
     context &mdash; WebTransport in G3+ requires that too, and
     <code>http://127.0.0.1</code> qualifies without a certificate.</p>
