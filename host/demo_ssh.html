<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SSH-WASM Demo (Loop #21 e2e)</title>
  <style>
    body { font-family: monospace; background: #1e1e1e; color: #d4d4d4; padding: 20px; }
    h1 { color: #569cd6; }
    pre { background: #252526; border: 1px solid #3c3c3c; padding: 12px; overflow-x: auto; }
  </style>
</head>
<body>
  <h1>SSH-WASM Demo: SSH Client → Server (Loop #21 e2e verify)</h1>
  <pre id="out">Loading...</pre>
  <script type="module">
    // Loop #21 e2e: 浏览器 JavaScript 模拟 SSH 客户端走 WebSocket,
    // 验证 mock SSH server (port 2222) 字节接收。
    // 不依赖 main.wasm (cmd/main 走 MockSocket path,4 target 一致)。
    const out = document.getElementById('out');
    out.textContent = '';

    const log = (s) => { out.textContent += s + '\n'; };

    function toHex(bytes) {
      return Array.from(bytes).map((b) => b.toString(16).padStart(2, '0')).join('');
    }

    function makeKexInit() {
      const payload = new Uint8Array([
        // cookie (16 bytes)
        0x01, 0x02, 0x03, 0x04, 0x05, 0x06, 0x07, 0x08,
        0x09, 0x0a, 0x0b, 0x0c, 0x0d, 0x0e, 0x0f, 0x10,
      ]);
      // 简化版: 不写完整 10 个 proposal strings, 用 minimal
      // packet = u32(len) + u8(padlen) + u8(type) + payload + padding
      const type = 0x14;
      const blockSize = 8;
      const payloadLen = payload.length;
      const totalLen = 1 + payloadLen; // msg_type + payload
      let padlen = blockSize - ((totalLen + 5) % blockSize);
      if (padlen < 4) padlen += blockSize;
      const packetLen = totalLen + padlen + 1;
      const packet = new Uint8Array(4 + 1 + totalLen + padlen);
      const dv = new DataView(packet.buffer);
      dv.setUint32(0, packetLen, false);
      packet[4] = padlen;
      packet[5] = type;
      payload.forEach((b, i) => packet[6 + i] = b);
      // padding bytes zero (deterministic)
      return packet;
    }

    function makeKexDhInit() {
      // type 0x1e + u32 length 32 + 32-byte Q_C
      const packet = new Uint8Array(1 + 4 + 32);
      packet[0] = 0x1e;
      const dv = new DataView(packet.buffer);
      dv.setUint32(1, 32, false);
      // Q_C = RFC 7748 Alice public key (Loop #17/20 一致)
      const alicePub = [
        0x85, 0x20, 0xf0, 0x09, 0x89, 0x30, 0xa7, 0x54,
        0x74, 0x8b, 0x7d, 0xdc, 0xb4, 0x3e, 0xf7, 0x5a,
        0x0d, 0xbf, 0x3a, 0x0d, 0x26, 0x38, 0x1a, 0xf4,
        0xeb, 0xa4, 0xa9, 0x8e, 0xaa, 0x9b, 0x4e, 0x6a,
      ];
      alicePub.forEach((b, i) => packet[5 + i] = b);
      return packet;
    }

    function makeNewkeys() {
      // type 0x15 + 7 bytes padding (deterministic)
      const packet = new Uint8Array(1 + 7);
      packet[0] = 0x15;
      return packet;
    }

    function makeVersion() {
      const bytes = new TextEncoder().encode('SSH-2.0-MoonBit\r\n');
      return bytes;
    }

    const clientVersion = makeVersion();
    const kexInit = makeKexInit();
    const kexDhInit = makeKexDhInit();
    const newkeys = makeNewkeys();

    log(`[client] version (${clientVersion.length}B): ${toHex(clientVersion)}`);
    log(`[client] KEXINIT (${kexInit.length}B): ${toHex(kexInit).substring(0, 60)}...`);
    log(`[client] KEXECDH_INIT (${kexDhInit.length}B): ${toHex(kexDhInit)}`);
    log(`[client] NEWKEYS (${newkeys.length}B): ${toHex(newkeys)}`);

    const ws = new WebSocket('ws://localhost:2222');
    ws.binaryType = 'arraybuffer';

    ws.onopen = () => {
      log('[client] WS opened, sending client version...');
      ws.send(clientVersion);
    };

    let state = 0;
    ws.onmessage = (e) => {
      const bytes = new Uint8Array(e.data);
      log(`[client] recv ${bytes.length}B: ${toHex(bytes).substring(0, 80)}`);
      // state machine: VERSION → KEXINIT → KEXECDH_INIT → NEWKEYS
      if (state === 0) {
        // server version (any length ~17-21)
        log('[client] received server version, sending KEXINIT...');
        ws.send(kexInit);
        state = 1;
      } else if (state === 1) {
        // server KEXINIT packet (~256B)
        log('[client] received server KEXINIT, sending KEXECDH_INIT...');
        ws.send(kexDhInit);
        state = 2;
      } else if (state === 2) {
        // server KEXDH_REPLY packet
        log('[client] received server KEXDH_REPLY, sending NEWKEYS...');
        ws.send(newkeys);
        state = 3;
      } else if (state === 3) {
        // server NEWKEYS packet
        log('[client] received server NEWKEYS, demo complete');
        ws.close();
      }
    };

    ws.onclose = () => {
      log('[client] WS closed');
      log('\n✓ SSH-WASM Demo completed (browser JS client → mock server)');
    };

    ws.onerror = (e) => {
      log('[client] WS error: ' + e);
    };
  </script>
</body>
</html>
