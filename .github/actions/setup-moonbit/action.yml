name: "Setup MoonBit"
description: >
  Install the MoonBit CLI and the native-target toolchain it needs, on the
  runner OS this job is actually running on.
inputs:
  version:
    description: "The MoonBit CLI channel to install: latest, pre-release, or nightly"
    required: false
    default: "latest"
runs:
  using: "composite"
  steps:
    # These two steps are transcribed from MoonBit's OWN CI, not invented:
    # moonbitlang/moonbit-docs, .github/actions/setup/action.yml (fetched
    # 2026-10-19). That repository runs its checks on a
    # ubuntu/macos/windows matrix with this exact file, so the Windows branch
    # below is a configuration its maintainers exercise, not one inferred from
    # documentation.
    #
    # The reason a branch is needed at all: the install path is a shell script
    # on *nix and a PowerShell script on Windows, and a `curl | bash` line
    # simply does not run under the Windows runner's default shell.
    - name: Install MoonBit CLI on *nix
      if: runner.os != 'Windows'
      shell: bash
      run: |
        curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s "${{ inputs.version }}"
        echo "$HOME/.moon/bin" >> $GITHUB_PATH

    - name: Install MoonBit CLI on Windows
      if: runner.os == 'Windows'
      shell: powershell
      env:
        MOONBIT_INSTALL_VERSION: ${{ inputs.version }}
      run: |
        Set-ExecutionPolicy RemoteSigned -Scope CurrentUser; irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
        # Loop #71: this was the literal "C:\Users\runneradmin\.moon\bin".
        # It works today because GitHub's Windows runner account happens to be
        # named `runneradmin` -- the one thing about a runner that is an
        # implementation detail and can change. $env:USERPROFILE is what the
        # install script above actually used, so this now names the same
        # directory instead of predicting it.
        "$env:USERPROFILE\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

    # The native target links against a C runtime, so on Windows the MSVC
    # environment has to be present before `moon build --target native` can
    # succeed. Without this the build steps fail at link time with a missing-
    # toolchain error that reads like a MoonBit bug rather than a missing
    # prerequisite, which is exactly the kind of misdiagnosis worth spending
    # a step to prevent.
    - name: Install MSVC on Windows
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1

    - name: Verify installation
      shell: bash
      run: |
        moon version --all

    - name: Update registry
      shell: bash
      run: |
        moon update
