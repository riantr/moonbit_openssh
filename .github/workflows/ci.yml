# Loop #64: CI lives in ci/ci.py, not here.
#
# This workflow is a thin shell on purpose. A second copy of the list of gates,
# written as YAML `steps:` entries, would drift from the Python engine within a
# couple of loops -- and the failure mode is silent: CI goes green because it
# stopped running the new gate. So the job installs the toolchain and then
# hands everything to the same engine a developer runs locally.
#
#   local:  python ci/ci.py
#   here:   python ci/ci.py --json ci/artifacts/ci.json
#
# The runner is WINDOWS, and that is load-bearing rather than incidental.
#
# `ci/qa.py` wraps every toolchain invocation as ["cmd", "/c", "moon", ...], and
# the .mjs gates shell out the same way. On ubuntu that fails with exit 127 --
# "command not found" -- on every single step, so the job was never going to go
# green there. That is not a bug in this workflow file: it is the workflow
# disagreeing with the engine it wraps. Measured on ubuntu-latest at commit
# a676ff7: `FAIL env moon version exit 127`, `FAIL build ... exit 127`, and so
# on for the whole step list.
#
# Making the engine cross-platform instead would be the other fix, and it is a
# bigger one: it touches ci/qa.py, ci/ci.py and every gate that shells out.
# Moving the runner costs one line per job and changes nothing about what is
# actually being verified. The trade is runner minutes -- Windows runners bill
# at roughly twice the Linux rate.
#
# This file was never exercised on GitHub before 2026-10-19; the local path
# (`python ci/ci.py`) bypasses it entirely, which is how a Windows-only engine
# sat behind an ubuntu runner without anyone noticing.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: gates
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # This step was missing, and its absence is the whole reason the first
      # real run on GitHub failed. package.json declares `ws` and `playwright`
      # as devDependencies, and node_modules/ is gitignored, so a fresh checkout
      # has neither -- and host/verify_loop23.mjs and host/verify_loop41.mjs both
      # do a bare `import WebSocket from 'ws'` at module load. Without this,
      # those two gates die in ~0.1s with:
      #
      #     Error [ERR_MODULE_NOT_FOUND]: Cannot find package 'ws'
      #
      # Measured on windows-latest at commit 64296b5: `FAIL verify_loop23.mjs
      # exit 1 0.1s` and `FAIL verify_loop41.mjs exit 1 0.1s`. Locally both
      # pass, because a developer's node_modules is already there -- the same
      # "local has it, CI does not" blind spot that let a Windows-only engine
      # sit behind an ubuntu runner.
      #
      # `npm ci` rather than `npm install`: package-lock.json is committed, and
      # ci installs exactly that tree instead of resolving ranges afresh, so a
      # green run names the dependency versions it actually used.
      - name: Install Node dependencies
        run: npm ci --no-audit --no-fund

      # These two are NOT optional extras, and the earlier comment here was
      # wrong about the second one.
      #
      # paramiko and cryptography are not vendored. The MITM peers that drive
      # the forgeries (host/*.py, host/sftp_mitm.py) import them, and a fresh
      # runner's Python has neither. Measured on GitHub run 39194939821, this
      # one omission is what turned ~11 gates red:
      #
      #     ModuleNotFoundError: No module named 'paramiko'
      #     ModuleNotFoundError: No module named 'cryptography'
      #
      # loop45 is the expensive one: it burned 928.7s and its LAST surviving
      # output line was `import paramiko`. It failed for the same reason.
      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check paramiko cryptography

      # The previous version of this file said, in a comment, that installing
      # Playwright browsers would "cost minutes per run to serve gates that
      # are not executing". That was wrong, and it was wrong by the same
      # reasoning error as the comment above it: it assumed the gates that
      # drive a browser are all in peer-gates. They are not.
      #
      # Measured on run 39194939821:
      #
      #     Executable doesn't exist at ...\ms-playwright\chromium-1124\...
      #     SKIP  the Worker run
      #     FAIL  harness  ReferenceError: Cannot access 'only' before ...
      #
      # verify_loop47 reaches Playwright unconditionally at startup and takes
      # a different code path when the browser is absent. It is in the default
      # tier, it runs here, and it needs the binary.
      - name: Install the Playwright browser
        run: npx playwright install chromium

      - name: Set up MoonBit
        uses: ./.github/actions/setup-moonbit

      - name: Cache MoonBit dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.moon
            .mooncakes
          key: moonbit-${{ runner.os }}-${{ hashFiles('moon.mod') }}
          restore-keys: moonbit-${{ runner.os }}-

      - name: Update MoonBit dependencies
        run: moon update

      # --list first: a CI run that silently discovered zero steps would report
      # green. The engine refuses to run with no steps, and this makes the
      # refusal visible in the log.
      - name: Show the discovered steps
        run: python ci/ci.py --tiers env,build,gates --list

      # Loop #72: `cmd/proton_gui` does not build without the shared Proton CEF
      # runtime, and nothing on a fresh runner installs it.
      #
      # Measured on run 39218394411, verify_loop41.mjs failed in 2.9s with:
      #
      #   browser_session.h(7): fatal error C1083:
      #     Cannot open include file: 'include/capi/cef_browser_capi.h'
      #   cl.exe ... -IC:/Users/runneradmin/.proton/store/win32-x64/
      #              cef-169847f3...-layout-1/sdk
      #
      # Note what that is: the path was COMPUTED correctly and the layout was
      # not there. `moon update` fetches the mooncake; it does not fetch CEF.
      # On a developer machine the CEF store exists because another project
      # installed it -- AGENTS.md records that the prerequisites came from
      # `moonbit_static_analysis`, not from this repository. So this is the
      # third runner prerequisite in a row (paramiko, then Playwright, then
      # this) that was "obviously already there" and was not.
      #
      # The first attempt at this step asserted that `proton_cli.exe` ships with
      # the MoonBit CLI and lives in `$env:USERPROFILE\.moon\bin`. It does not.
      # Run 39230209722 answered in one second:
      #
      #   Write-Error: proton_cli.exe not found at
      #     C:\Users\runneradmin\.moon\bin\proton_cli.exe -- it ships with the
      #     MoonBit CLI install.
      #
      # `https://cli.moonbitlang.com/install/powershell.ps1` was then read in
      # full: it fetches `moonbit-latest.zip` and
      # `moonbit-windows-x86_64-dev.zip` from cli.moonbitlang.com and extracts
      # them into `.moon`. Neither archive contains `proton_cli.exe`, and
      # `moon --help` has no `proton` subcommand. The tool is distributed as a
      # REGISTRY package instead, which is why a developer machine has one and a
      # runner does not.
      #
      # Two facts here came from reading the actual tool rather than from
      # memory, and both contradicted something I would otherwise have shipped:
      #
      #   * `moon install --help` has NO `--path` flag. The published Proton
      #     README says `moon install --path cli --bin target\proton-tools`,
      #     and that line fails. The real signature is a positional SOURCE
      #     (`user/module/pkg[@version]`) plus `--bin DIR`.
      #   * `justjavac/proton_cli` is DEPRECATED; `moon view` says so and points
      #     at `moonbit-community/proton_cli`.
      #
      # The version is pinned, and the reason is in the assertion below rather
      # than in taste: the CEF archive is a property of the CLI version. 0.3.4
      # requires `cef_binary_150.0.19+gcf60f42+chromium-150.0.7871.252`,
      # sha256 169847f3..., which is exactly the `cef-169847f3...` in the failure
      # above. A floating `@latest` would have installed 0.5.0, which wants a
      # different archive, and the two halves of the build would have disagreed
      # about which CEF this is -- the same "an untrue declaration" failure this
      # repository has now hit three times.
      - name: Provision the Proton CEF runtime
        shell: pwsh
        # Bounded on purpose: `cef setup` downloads and unpacks a ~150MB CEF
        # layout and there is no --dry-run to rehearse it against, so this is
        # the one step in the job whose behaviour is being discovered rather
        # than verified. A cap turns "the runner hung" into a red step with a
        # name instead of a 6-hour job timeout.
        timeout-minutes: 20
        run: |
          $ErrorActionPreference = 'Stop'
          $binDir = "$env:USERPROFILE\.moon\bin"
          # Pinned to the version whose `cef requirements` matches the sha the
          # build resolves. See the comment above.
          moon install "moonbit-community/proton_cli@0.3.4" --bin $binDir
          if ($LASTEXITCODE -ne 0) {
            Write-Error "moon install moonbit-community/proton_cli@0.3.4 exited $LASTEXITCODE"
            exit 1
          }
          # Discovered, not assumed: the published README calls the binary
          # `proton` and the file this writes is `proton_cli.exe`. Naming it
          # here would be a guess about a filename, in the step whose whole
          # subject is a toolchain component that was not where I said it was.
          $cli = Get-ChildItem $binDir -Filter 'proton*.exe' -ErrorAction SilentlyContinue |
                 Select-Object -First 1
          if (-not $cli) {
            Write-Error "moon install reported success but no proton*.exe is in $binDir"
            exit 1
          }
          & $cli.FullName cef setup
          if ($LASTEXITCODE -ne 0) {
            Write-Error "`"$($cli.Name) cef setup` exited $LASTEXITCODE"
            exit 1
          }
          # And then check the thing the build actually asks for, by asking the
          # tool rather than by remembering the layout convention. A mismatch
          # here is the C1083 from four steps away, said out loud instead.
          $req = (& $cli.FullName cef requirements | ConvertFrom-Json)
          $layout = "$env:USERPROFILE\.proton\store\$($req.platform)\cef-$($req.cef_sha256)-layout-$($req.layout_version)"
          Write-Host "proton $($req.proton_version) wants CEF $($req.cef_archive)"
          if (-not (Test-Path (Join-Path $layout 'sdk\include\capi\cef_browser_capi.h'))) {
            Write-Error "cef setup exited 0 but $layout\sdk\include\capi\cef_browser_capi.h is absent -- cmd/proton_gui will fail with C1083"
            exit 1
          }
          Write-Host "CEF layout present: $layout"

      # Loop #74: verify_loop53.mjs opens by requiring eleven certificate
      # fixtures in `.loop53/`, and NOTHING in this repository created them.
      # They were made once, on one machine, on 2026-10-13, and every run since
      # -- all of them local -- found them already there. On a fresh runner:
      #
      #   loop53: FAIL  fixtures  missing .loop53/ca
      #   loop53: 2/3 checks passed
      #
      # Same shape as the `-b` splice fixed in this loop: a gate whose inputs
      # exist only where the gate has already run, green on every developer
      # machine and red on every clean checkout. It cost three 16-minute runs to
      # notice.
      #
      # `host/cert_gen_fixture.py` looks like the producer and is not -- it READS
      # `.loop53/*.pub` and emits `src/hostkey/cert_fixture.mbt`. It is also
      # referenced nowhere in the tree.
      #
      # Generating rather than committing the keys: they are throwaway test keys
      # that sign nothing, so the security cost of committing them is nil, but a
      # repository that carries private keys keeps carrying them and a reviewer
      # cannot tell a test CA from a real one in a diff. Generating makes the
      # fixture set reproducible and reviewable as code.
      #
      # Known gap, stated rather than hidden: `cert_fixture.mbt` is committed and
      # was generated from the PREVIOUS `.loop53` certificates, and no gate
      # compares the two. Fresh fixtures therefore widen a gap that already
      # exists. loop53 asserts behaviour over these vectors, not particular
      # bytes, so this run tests what it claims to test; closing the
      # correspondence is separate work with its own loop.
      - name: Provision the loop53 certificate fixtures
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node host\gen_loop53_fixtures.mjs
          if ($LASTEXITCODE -ne 0) {
            Write-Error "gen_loop53_fixtures.mjs exited $LASTEXITCODE"
            exit 1
          }
          # And then ask, rather than trusting the generator's own summary: the
          # gate will otherwise be the one to discover a missing file, three
          # steps later, in a message that names neither the cause nor the
          # command that fixes it.
          node host\gen_loop53_fixtures.mjs --check
          if ($LASTEXITCODE -ne 0) {
            Write-Error "the loop53 certificate fixtures are still incomplete after generating"
            exit 1
          }

      - name: Run gates
        run: python ci/ci.py --tiers env,build,gates --json ci/artifacts/ci.json
        env:
          PYTHONIOENCODING: utf-8

      # The whole directory, not just ci.json. ci/artifacts/steps/ holds the
      # complete stdout of every failing step, which is the only place the
      # middle of a 15-minute failure still exists once the job ends.
      #
      # `.loop70/` is the same idea one level down: host/keep_output.mjs makes
      # the GATES keep their children's transcripts (verify_loop41's compiler
      # output, verify_loop55's, the sshd probe's), and without this second
      # path those transcripts are produced on the runner and thrown away with
      # the VM. Measured on run 39204915519: verify_loop41's kept transcript was
      # 990 bytes of console output plus a build log nobody could reach.
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-report
          path: |
            ci/artifacts/
            .loop70/
          # `include-hidden-files` is not optional here, it is the whole reason
          # this step does not work without it. upload-artifact@v4 SKIPS
          # dot-prefixed paths by default, so `.loop70/` matched nothing while
          # `ci/artifacts/` matched something -- and `if-no-files-found: warn`
          # stayed quiet, because from the step's point of view it had found
          # files.
          #
          # Measured on run 39206855898, the run that first asked for
          # `.loop70/`: the artifact contains `ci/artifacts/ci.json` and five
          # step logs, and no `.loop70/` at all. verify_loop41, 55, 56 and 65
          # all failed, so those transcripts were written. They were then
          # discarded with the runner.
          #
          # This is the third time in three loops that a fix was correct and
          # the plumbing ate it: Loop #69's 12 lines, Loop #70's `.loop70/`
          # living outside the upload path, and now a dotfile the uploader
          # ignores. Each time the failure was invisible because the thing
          # being fixed was the thing doing the hiding.
          include-hidden-files: true
          if-no-files-found: warn

  qa-matrix:
    # The QA category matrix (ci/qa.py). Opt-in on purpose, and NOT folded into
    # the gates job: several of these commands are slow, and three are red today
    # for understood, documented reasons -- `moon fmt --check`, `moon check
    # --deny-warn` (90 test_unqualified_package warnings), and `moon coverage
    # analyze` (no output data). Making them gate pull requests would mean
    # either letting a known-red job block every PR or deleting the rows, and
    # deleting the rows is the failure mode this project keeps getting hit.
    #
    # So it runs on workflow_dispatch and on pushes to main, as a REPORT. The
    # engine's own exit code is still honest: if it exits 1 the job is red.
    name: qa category matrix
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Set up MoonBit
        uses: ./.github/actions/setup-moonbit

      - name: Show the QA categories
        run: python ci/ci.py --tiers qa --list

      - name: Run the QA category matrix
        run: python ci/ci.py --tiers qa --json ci/artifacts/qa.json

  engine-self-check:
    # Runs first and fast. If the engine's own accounting is broken, nothing
    # the gates report can be trusted, so this gates everything else.
    name: engine self-check
    runs-on: windows-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify the CI engine's own bookkeeping
        # Runs first and on its own: if the engine's accounting is broken,
        # nothing it reports -- including a green tag decision -- can be
        # trusted. This also covers the release gate's pure tag logic.
        run: python ci/ci.py --self-check

  release-gate:
    # Deliberately manual, and deliberately a *report* rather than an action.
    # The tag rule the owner set is: no tag until the local CI is fully green,
    # even on request. So this job never creates a tag on a red run; it tells
    # you whether a tag WOULD be allowed, and a human (or an agent holding the
    # same rule) creates it locally with
    #     python ci/ci.py --tiers ... --tag
    # Pushing to gitee is allowed at any time. Pushing to GitHub is allowed
    # only after a green run and a tag -- see ci/release.py.
    name: release gate (report only)
    runs-on: windows-latest
    timeout-minutes: 20
    if: always() && needs.engine-self-check.result == 'success'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Set up MoonBit
        uses: ./.github/actions/setup-moonbit
      - name: Would a tag be allowed right now?
        # Exits 1 when the gate would refuse, which is the honest answer.
        # This job is allowed to fail: a red gate is the expected state most
        # of the time, and hiding that would defeat its purpose.
        run: python ci/ci.py --tiers env,build,gates,qa --check-release
