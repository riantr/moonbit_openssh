# Loop #64: CI lives in ci/ci.py, not here.
#
# This workflow is a thin shell on purpose. A second copy of the list of gates,
# written as YAML `steps:` entries, would drift from the Python engine within a
# couple of loops -- and the failure mode is silent: CI goes green because it
# stopped running the new gate. So the job installs the toolchain and then
# hands everything to the same engine a developer runs locally.
#
#   local:  python ci/ci.py
#   here:   python ci/ci.py --json ci/artifacts/ci.json
#
# The runner is WINDOWS, and that is load-bearing rather than incidental.
#
# `ci/qa.py` wraps every toolchain invocation as ["cmd", "/c", "moon", ...], and
# the .mjs gates shell out the same way. On ubuntu that fails with exit 127 --
# "command not found" -- on every single step, so the job was never going to go
# green there. That is not a bug in this workflow file: it is the workflow
# disagreeing with the engine it wraps. Measured on ubuntu-latest at commit
# a676ff7: `FAIL env moon version exit 127`, `FAIL build ... exit 127`, and so
# on for the whole step list.
#
# Making the engine cross-platform instead would be the other fix, and it is a
# bigger one: it touches ci/qa.py, ci/ci.py and every gate that shells out.
# Moving the runner costs one line per job and changes nothing about what is
# actually being verified. The trade is runner minutes -- Windows runners bill
# at roughly twice the Linux rate.
#
# This file was never exercised on GitHub before 2026-10-19; the local path
# (`python ci/ci.py`) bypasses it entirely, which is how a Windows-only engine
# sat behind an ubuntu runner without anyone noticing.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: gates
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # This step was missing, and its absence is the whole reason the first
      # real run on GitHub failed. package.json declares `ws` and `playwright`
      # as devDependencies, and node_modules/ is gitignored, so a fresh checkout
      # has neither -- and host/verify_loop23.mjs and host/verify_loop41.mjs both
      # do a bare `import WebSocket from 'ws'` at module load. Without this,
      # those two gates die in ~0.1s with:
      #
      #     Error [ERR_MODULE_NOT_FOUND]: Cannot find package 'ws'
      #
      # Measured on windows-latest at commit 64296b5: `FAIL verify_loop23.mjs
      # exit 1 0.1s` and `FAIL verify_loop41.mjs exit 1 0.1s`. Locally both
      # pass, because a developer's node_modules is already there -- the same
      # "local has it, CI does not" blind spot that let a Windows-only engine
      # sit behind an ubuntu runner.
      #
      # `npm ci` rather than `npm install`: package-lock.json is committed, and
      # ci installs exactly that tree instead of resolving ranges afresh, so a
      # green run names the dependency versions it actually used.
      - name: Install Node dependencies
        run: npm ci --no-audit --no-fund

      # These two are NOT optional extras, and the earlier comment here was
      # wrong about the second one.
      #
      # paramiko and cryptography are not vendored. The MITM peers that drive
      # the forgeries (host/*.py, host/sftp_mitm.py) import them, and a fresh
      # runner's Python has neither. Measured on GitHub run 39194939821, this
      # one omission is what turned ~11 gates red:
      #
      #     ModuleNotFoundError: No module named 'paramiko'
      #     ModuleNotFoundError: No module named 'cryptography'
      #
      # loop45 is the expensive one: it burned 928.7s and its LAST surviving
      # output line was `import paramiko`. It failed for the same reason.
      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check paramiko cryptography

      # The previous version of this file said, in a comment, that installing
      # Playwright browsers would "cost minutes per run to serve gates that
      # are not executing". That was wrong, and it was wrong by the same
      # reasoning error as the comment above it: it assumed the gates that
      # drive a browser are all in peer-gates. They are not.
      #
      # Measured on run 39194939821:
      #
      #     Executable doesn't exist at ...\ms-playwright\chromium-1124\...
      #     SKIP  the Worker run
      #     FAIL  harness  ReferenceError: Cannot access 'only' before ...
      #
      # verify_loop47 reaches Playwright unconditionally at startup and takes
      # a different code path when the browser is absent. It is in the default
      # tier, it runs here, and it needs the binary.
      - name: Install the Playwright browser
        run: npx playwright install chromium

      - name: Set up MoonBit
        uses: ./.github/actions/setup-moonbit

      - name: Cache MoonBit dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.moon
            .mooncakes
          key: moonbit-${{ runner.os }}-${{ hashFiles('moon.mod') }}
          restore-keys: moonbit-${{ runner.os }}-

      - name: Update MoonBit dependencies
        run: moon update

      # --list first: a CI run that silently discovered zero steps would report
      # green. The engine refuses to run with no steps, and this makes the
      # refusal visible in the log.
      - name: Show the discovered steps
        run: python ci/ci.py --tiers env,build,gates --list

      - name: Run gates
        run: python ci/ci.py --tiers env,build,gates --json ci/artifacts/ci.json

      # The whole directory, not just ci.json. ci/artifacts/steps/ holds the
      # complete stdout of every failing step, which is the only place the
      # middle of a 15-minute failure still exists once the job ends.
      #
      # `.loop70/` is the same idea one level down: host/keep_output.mjs makes
      # the GATES keep their children's transcripts (verify_loop41's compiler
      # output, verify_loop55's, the sshd probe's), and without this second
      # path those transcripts are produced on the runner and thrown away with
      # the VM. Measured on run 39204915519: verify_loop41's kept transcript was
      # 990 bytes of console output plus a build log nobody could reach.
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-report
          path: |
            ci/artifacts/
            .loop70/
          if-no-files-found: warn

  qa-matrix:
    # The QA category matrix (ci/qa.py). Opt-in on purpose, and NOT folded into
    # the gates job: several of these commands are slow, and three are red today
    # for understood, documented reasons -- `moon fmt --check`, `moon check
    # --deny-warn` (90 test_unqualified_package warnings), and `moon coverage
    # analyze` (no output data). Making them gate pull requests would mean
    # either letting a known-red job block every PR or deleting the rows, and
    # deleting the rows is the failure mode this project keeps getting hit.
    #
    # So it runs on workflow_dispatch and on pushes to main, as a REPORT. The
    # engine's own exit code is still honest: if it exits 1 the job is red.
    name: qa category matrix
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Set up MoonBit
        uses: ./.github/actions/setup-moonbit

      - name: Show the QA categories
        run: python ci/ci.py --tiers qa --list

      - name: Run the QA category matrix
        run: python ci/ci.py --tiers qa --json ci/artifacts/qa.json

  engine-self-check:
    # Runs first and fast. If the engine's own accounting is broken, nothing
    # the gates report can be trusted, so this gates everything else.
    name: engine self-check
    runs-on: windows-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify the CI engine's own bookkeeping
        # Runs first and on its own: if the engine's accounting is broken,
        # nothing it reports -- including a green tag decision -- can be
        # trusted. This also covers the release gate's pure tag logic.
        run: python ci/ci.py --self-check

  release-gate:
    # Deliberately manual, and deliberately a *report* rather than an action.
    # The tag rule the owner set is: no tag until the local CI is fully green,
    # even on request. So this job never creates a tag on a red run; it tells
    # you whether a tag WOULD be allowed, and a human (or an agent holding the
    # same rule) creates it locally with
    #     python ci/ci.py --tiers ... --tag
    # Pushing to gitee is allowed at any time. Pushing to GitHub is allowed
    # only after a green run and a tag -- see ci/release.py.
    name: release gate (report only)
    runs-on: windows-latest
    timeout-minutes: 20
    if: always() && needs.engine-self-check.result == 'success'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Set up MoonBit
        uses: ./.github/actions/setup-moonbit
      - name: Would a tag be allowed right now?
        # Exits 1 when the gate would refuse, which is the honest answer.
        # This job is allowed to fail: a red gate is the expected state most
        # of the time, and hiding that would defeat its purpose.
        run: python ci/ci.py --tiers env,build,gates,qa --check-release
