# Loop #57 fixture: options that appear BEFORE any Host block.
#
# ssh_config(5): "Since the first obtained value for each parameter is used", and
# readconf.c applies everything before the first Host unconditionally. Verified
# against ssh -G on OpenSSH_for_Windows_9.5p2: user=topuser port=2200 win here,
# and ServerAliveInterval still comes from `Host *`.
#
# The old parser accumulated these options into a section with no patterns, and
# then dropped that section on the first `Host` line -- they went nowhere.

User topuser
Port 2200

Host web1
  HostName web1.internal.example.com

Host *
  ServerAliveInterval 30
  ForwardAgent yes