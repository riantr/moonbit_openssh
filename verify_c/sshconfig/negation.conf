# Loop #57 fixture: negated Host patterns.
#
# Verified against ssh -G (OpenSSH_for_Windows_9.5p2):
#   host `secret` -> compression no   (the `!secret *` block is skipped ENTIRELY)
#   host `other`  -> compression yes  (it matches, and first-obtained wins over `Host *`)
#
# So the rule is not "a negated pattern vetoes just that pattern". One match on a
# negated pattern discards the whole block, including its positive patterns.

Host !secret *
  Compression yes

Host *
  Compression no