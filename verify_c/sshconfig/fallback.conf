# Loop #57 fixture: the `Host *` fallback, which is the idiom the old resolver broke.
#
# `Host web1` sets User but NOT Port. OpenSSH therefore takes Port from `Host *`.
# match_host_option() only ever looked inside the FIRST matching section, so it
# answered "no such option" for Port -- silently, because nothing was using it.

Host web1
  HostName web1.internal.example.com
  User deploy

Host *
  User fallback
  Port 2222
  ServerAliveInterval 30