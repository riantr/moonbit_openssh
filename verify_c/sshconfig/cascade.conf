# Loop #57 fixture: three blocks all match one host, and the keyword the first
# block does NOT mention has to fall through two more blocks to find a value.
#
# host `db1.prod.example.com` matches `*.prod.example.com`, `*.example.com` and
# `*`. Expected (first obtained wins):
#   user        u1   (first block)
#   hostname    h1   (first block)
#   port        2223 (second block -- this is the fall-through being tested)
#   identityfile k3  (third block  -- two levels of fall-through)
#
# The old resolver would have returned only the first block and answered "absent"
# for port and identityfile.

Host *.prod.example.com
  User u1
  HostName h1

Host *.example.com
  Port 2223

Host *
  IdentityFile /k/three
  ForwardAgent yes
  ConnectTimeout 9