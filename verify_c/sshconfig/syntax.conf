# Loop #57 fixture: keyword syntax that the old parser got wrong on both counts.
#
#   1. Keyword matching is case-insensitive (readconf.c uses strcasecmp).
#      Verified: HOST/host, USER/user and PoRt all take effect.
#   2. `Keyword=Value` is accepted, not just `Keyword Value`. Verified: port 2202.
#   3. A `#` starts a comment anywhere on the line, not only at position 0.
#      Verified: `User bob # trailing comment` resolves to `bob`, not to the
#      whole rest of the line.
#   4. Within one block a repeated keyword keeps the FIRST value (u1, not u2).
#
# Separately: Host patterns are matched case-SENSITIVELY. `Host Web1` does not
# match host `web1` -- checked, because ssh_config(5) is ambiguous about it and
# guessing would have been the wrong kind of confident.

HOST alpha
  USER u1
  user u2
  IdentityFile /tmp/a

host beta
  PoRt 2202

Host gamma
  User bob # trailing comment
  ConnectTimeout=7